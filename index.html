function timeToMinutes(time){
const parts=time.split(":");
return Number(parts[0])*60+Number(parts[1]);
}

function formatRemaining(seconds){
seconds=Math.max(0,Math.floor(seconds));
const hours=Math.floor(seconds/3600);
const minutes=Math.floor((seconds%3600)/60);
const secs=seconds%60;

if(hours){
return String(hours).padStart(2,"0")+":"+
String(minutes).padStart(2,"0")+":"+
String(secs).padStart(2,"0");
}

return String(minutes).padStart(2,"0")+":"+
String(secs).padStart(2,"0");
}

function getAlgeriaTime(){

const parts=new Intl.DateTimeFormat(
"en-US",
{
timeZone:ALGERIA_TIMEZONE,
weekday:"long",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
}
).formatToParts(new Date());

const result={};

parts.forEach(part=>{
if(part.type!=="literal"){
result[part.type]=part.value;
}
});

let hour=Number(result.hour);

if(hour===24) hour=0;

return {
weekday:result.weekday,
hour,
minute:Number(result.minute),
second:Number(result.second)
};
}

hour12:false
}
);

"🕐 "+formatter.format(new Date());

/* =========================

========================= */

let audioContext=null;
let alarmOscillator=null;
let alarmGain=null;
let alarmLfo=null;
let alarmLfoGain=null;

let bellEnabled =
localStorage.getItem("studyBellEnabled")==="true";

let alarmRinging=false;

function createAudioContext(){

const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContextClass){
return null;
}

if(!audioContext){
audioContext=new AudioContextClass();
}

if(audioContext.state==="suspended"){
audioContext.resume().catch(()=>{});
}

return audioContext;
}

function playBell(){

const ctx=createAudioContext();

if(!ctx) return;

if(ctx.state==="suspended"){

ctx.resume().then(()=>{
playBellSound();
}).catch(()=>{});

return;
}

playBellSound();
}

function playBellSound(){

if(!audioContext) return;

const ctx=audioContext;
const now=ctx.currentTime;

const oscillator=ctx.createOscillator();
const gain=ctx.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(880,now);
oscillator.frequency.exponentialRampToValueAtTime(
660,
now+0.25
);

gain.gain.setValueAtTime(0.0001,now);

gain.gain.exponentialRampToValueAtTime(
0.45,
now+0.03
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
now+0.65
);

oscillator.connect(gain);
gain.connect(ctx.destination);

oscillator.start(now);
oscillator.stop(now+0.7);
}


/*
المنبه يبقى مشتغلاً
حتى يضغط الطالب على زر إيقاف المنبه
*/

function startAlarm(){

if(!bellEnabled || alarmRinging){
return;
}

const ctx=createAudioContext();

if(!ctx){
return;
}

const startSound=()=>{

if(alarmRinging){
return;
}

alarmRinging=true;

const button=document.getElementById("bellButton");

if(button){

button.classList.remove("active");
button.classList.add("ringing");

button.textContent="🛑 إيقاف المنبه";
}


/* الصوت الرئيسي */

alarmOscillator=ctx.createOscillator();
alarmGain=ctx.createGain();

alarmOscillator.type="sine";

alarmOscillator.frequency.setValueAtTime(
880,
ctx.currentTime
);

alarmGain.gain.setValueAtTime(
0.0001,
ctx.currentTime
);

alarmGain.gain.linearRampToValueAtTime(
0.35,
ctx.currentTime+0.05
);

alarmOscillator.connect(alarmGain);
alarmGain.connect(ctx.destination);

alarmOscillator.start();


/* اهتزاز صوتي */

alarmLfo=ctx.createOscillator();
alarmLfoGain=ctx.createGain();

alarmLfo.type="sine";

alarmLfo.frequency.setValueAtTime(
4,
ctx.currentTime
);

alarmLfoGain.gain.setValueAtTime(
0.16,
ctx.currentTime
);

alarmLfo.connect(alarmLfoGain);
alarmLfoGain.connect(alarmGain.gain);

alarmLfo.start();

};

if(ctx.state==="suspended"){

ctx.resume()
.then(startSound)
.catch(()=>{});

}else{

startSound();

}

}

function stopAlarm(){

alarmRinging=false;

if(alarmOscillator){

try{
alarmOscillator.stop();
}catch(e){}

try{
alarmOscillator.disconnect();
}catch(e){}

alarmOscillator=null;
}

if(alarmLfo){

try{
alarmLfo.stop();
}catch(e){}

try{
alarmLfo.disconnect();
}catch(e){}

alarmLfo=null;
}

if(alarmGain){

try{
alarmGain.disconnect();
}catch(e){}

alarmGain=null;
}

if(alarmLfoGain){

try{
alarmLfoGain.disconnect();
}catch(e){}

alarmLfoGain=null;
}

const button=document.getElementById("bellButton");

if(!button){
return;
}

button.classList.remove("ringing");

if(bellEnabled){

button.classList.add("active");

button.textContent="🔕 إيقاف الجرس";

}else{

button.classList.remove("active");

button.textContent="🔔 تفعيل الجرس";

}

}


/*
هذه هي الدالة التي يصل إليها زر الجرس

function enableBell(){

/* إذا كان المنبه يرن، فالضغط يوقفه */

if(alarmRinging){

stopAlarm();
return;

}

const ctx=createAudioContext();

if(!ctx){

alert("متصفحك لا يدعم تشغيل الجرس.");
return;

}

bellEnabled=!bellEnabled;

localStorage.setItem(
"studyBellEnabled",
String(bellEnabled)
);

const button=document.getElementById("bellButton");

if(bellEnabled){

button.classList.add("active");

button.classList.remove("ringing");

button.textContent="🔕 إيقاف الجرس";

/*
تشغيل صوت قصير فور التفعيل
حتى يسمح المتصفح بالصوت لاحقاً
*/

playBell();

}else{

stopAlarm();

}

}

/* =========================
   الحصة الحالية
========================= */

let lastStartBell="";
let lastEndBell="";

function updateCurrentLesson(){

const now=getAlgeriaTime();

const day=arabicDays[now.weekday];

const currentSeconds =
now.hour*3600+
now.minute*60+
now.second;

const lessons=schedule[day]||[];

const sortedLessons=[...lessons].sort(
(a,b)=>timeToMinutes(a.start)-timeToMinutes(b.start)
);

let currentLesson=null;
let nextLesson=null;

for(const lesson of sortedLessons){

const startSeconds=timeToMinutes(lesson.start)*60;
const endSeconds=timeToMinutes(lesson.end)*60;

if(
currentSeconds>=startSeconds &&
currentSeconds<endSeconds
){

currentLesson=lesson;
break;

}

if(
startSeconds>currentSeconds &&
!nextLesson
){

nextLesson=lesson;

}

}

const container=
document.getElementById("currentLesson");

if(currentLesson){

const startSeconds=
timeToMinutes(currentLesson.start)*60;

const endSeconds=
timeToMinutes(currentLesson.end)*60;

const remaining=
endSeconds-currentSeconds;

container.innerHTML=`

<div class="lesson-status">
🔴 الحصة جارية الآن
</div>

<div class="current-subject">
${currentLesson.subject}
</div>

<div class="current-time">
${currentLesson.start} → ${currentLesson.end}
</div>

<div class="school-timer">

<div class="school-timer-label">
⏳ الوقت المتبقي لإكمال الحصة
</div>

<div class="school-timer-display">
${formatRemaining(remaining)}
</div>

</div>

`;

const lessonKey =
day+"-"+(currentLesson.id||currentLesson.subject);

if(
currentSeconds>=startSeconds &&
currentSeconds<=startSeconds+2 &&
lastStartBell!==lessonKey
){

lastStartBell=lessonKey;

if(bellEnabled){
startAlarm();
}

}

if(
remaining<=2 &&
remaining>=0 &&
lastEndBell!==lessonKey
){

lastEndBell=lessonKey;

if(bellEnabled){
startAlarm();
}

}

return;

}

if(nextLesson){

const startSeconds=
timeToMinutes(nextLesson.start)*60;

const secondsUntil=
startSeconds-currentSeconds;

container.innerHTML=`

<div class="lesson-status">
⏳ الحصة القادمة
</div>

<div class="current-subject">
${nextLesson.subject}
</div>

<div class="current-time">
تبدأ الساعة ${nextLesson.start}
وتنتهي الساعة ${nextLesson.end}
</div>

<div class="school-timer">

<div class="school-timer-label">
⏰ تبدأ بعد
</div>

<div class="school-timer-display">
${formatRemaining(secondsUntil)}
</div>

</div>

`;

return;

}

if(!lessons.length){

container.innerHTML=`

<div class="lesson-status">
💤 لا توجد حصص مراجعة اليوم
</div>

<div class="current-subject">
استمتع بوقتك 💙
</div>

<div class="current-time">
لا توجد مادة مبرمجة لهذا اليوم.
</div>

`;

return;

}

container.innerHTML=`

<div class="lesson-status">
✅ انتهت حصص اليوم
</div>

<div class="current-subject">
أحسنت! 🎉
</div>

<div class="current-time">
يمكنك الآن الراحة أو المراجعة.
</div>

`;

}

function renderSchedule(){

const container=document.getElementById("schedule");

container.innerHTML="";

Object.keys(schedule).forEach(day=>{

const dayCard=document.createElement("div");

dayCard.className="day-card";

dayCard.innerHTML=
`<div class="day-title">${day}</div>`;

schedule[day].forEach(lesson=>{

const completed=
localStorage.getItem(
`completed-${lesson.id}`
)==="true";

const lessonDiv=
document.createElement("div");

lessonDiv.className=
"lesson"+(completed?" completed":"");

lessonDiv.innerHTML=`

<div class="lesson-info">

<div>${lesson.subject}</div>

<div class="lesson-time">
${lesson.start} → ${lesson.end}
</div>

</div>

<button onclick="toggleComplete('${lesson.id}')">
${completed?"↩️":"✅"}
</button>

<button onclick="openEdit('${day}','${lesson.id}')">
✏️
</button>

<button
class="restore"
onclick="restoreLesson('${day}','${lesson.id}')">

↩️ الأصل

</button>

`;

dayCard.appendChild(lessonDiv);

});

container.appendChild(dayCard);

});

updateStats();
updateCurrentLesson();

}

function toggleComplete(id){

const key=`completed-${id}`;

const current=
localStorage.getItem(key)==="true";

localStorage.setItem(
key,
String(!current)
);

renderSchedule();

}

function updateStats(){

const allLessons=
Object.values(schedule).flat();

const completed=
allLessons.filter(
lesson=>
localStorage.getItem(
`completed-${lesson.id}`
)==="true"
).length;

document.getElementById(
"completedLessons"
).textContent=completed;

const now=getAlgeriaTime();

const today=
arabicDays[now.weekday];

const todayLessons=
schedule[today]||[];

document.getElementById(
"todayLessons"
).textContent=
todayLessons.length;

document.getElementById(
"studyHours"
).textContent=
completed;

const achievements=[
["achievement1",1],
["achievement5",5],
["achievement10",10],
["achievement25",25]
];

achievements.forEach(item=>{

const element=
document.getElementById(item[0]);

if(element){

element.classList.toggle(
"unlocked",
completed>=item[1]
);

}

});

}

let editingDay=null;
let editingId=null;

function openEdit(day,id){

const lesson=
schedule[day].find(
item=>item.id===id
);

if(!lesson)return;

editingDay=day;
editingId=id;

document.getElementById(
"editDay"
).value=day;

document.getElementById(
"editStart"
).value=lesson.start;

document.getElementById(
"editEnd"
).value=lesson.end;

document.getElementById(
"editModal"
).style.display="flex";

}

function closeModal(){

document.getElementById(
"editModal"
).style.display="none";

editingDay=null;
editingId=null;

}

function saveEdit(){

if(!editingDay||!editingId)return;

const start=
document.getElementById(
"editStart"
).value;

const end=
document.getElementById(
"editEnd"
).value;

if(!start||!end){

alert("اختر وقت البداية والنهاية.");
return;

}

if(
timeToMinutes(start)>=
timeToMinutes(end)
){

alert(
"وقت النهاية يجب أن يكون بعد وقت البداية."
);

return;

}

const lesson=
schedule[editingDay].find(
item=>item.id===editingId
);

if(lesson){

lesson.start=start;
lesson.end=end;

}

localStorage.setItem(
"myStudySchedule",
JSON.stringify(schedule)
);

closeModal();

renderSchedule();

}

function restoreLesson(day,id){

const original=
originalSchedule[day].find(
item=>item.id===id
);

const current=
schedule[day].find(
item=>item.id===id
);

if(!original||!current)return;

current.start=original.start;
current.end=original.end;

localStorage.setItem(
"myStudySchedule",
JSON.stringify(schedule)
);

renderSchedule();

}

function resetAllSchedule(){

if(!confirm(
"هل تريد إعادة برنامج المراجعة الأصلي بالكامل؟"
))return;

schedule=
JSON.parse(
JSON.stringify(originalSchedule)
);

localStorage.setItem(
"myStudySchedule",
JSON.stringify(schedule)
);

renderSchedule();

alert(
"تمت إعادة البرنامج الأصلي ✅"
);

}

/* =========================
   مؤقت الدراسة
========================= */

let timerSeconds=25*60;
let timerInterval=null;
let timerRunning=false;

function formatTimer(seconds){

const minutes=
Math.floor(seconds/60);

const secs=seconds%60;

return String(minutes).padStart(2,"0")+
":"+
String(secs).padStart(2,"0");

}

function updateTimerDisplay(){

document.getElementById(
"timerDisplay"
).textContent=
formatTimer(timerSeconds);

}

function changeTimer(){

if(timerRunning)return;

const minutes=
Number(
document.getElementById(
"timerSelect"
).value
);

timerSeconds=minutes*60;

document.getElementById(
"timerStatus"
).textContent=
"جاهز للدراسة 💪";

updateTimerDisplay();

}

function startTimer(){

if(timerRunning)return;

createAudioContext();

timerRunning=true;

document.getElementById(
"timerStatus"
).textContent=
"📚 وقت الدراسة الآن...";

timerInterval=setInterval(()=>{

if(timerSeconds>0){

timerSeconds--;

updateTimerDisplay();

}else{

finishTimer();

}

},1000);

}

function pauseTimer(){

if(!timerRunning)return;

clearInterval(timerInterval);

timerInterval=null;
timerRunning=false;

document.getElementById(
"timerStatus"
).textContent=
"⏸️ تم إيقاف المؤقت مؤقتًا";

}

function resetTimer(){

clearInterval(timerInterval);

timerInterval=null;
timerRunning=false;

const minutes=
Number(
document.getElementById(
"timerSelect"
).value
);

timerSeconds=minutes*60;

document.getElementById(
"timerStatus"
).textContent=
"جاهز للدراسة 💪";

updateTimerDisplay();

}

function finishTimer(){

clearInterval(timerInterval);

timerInterval=null;
timerRunning=false;

timerSeconds=0;

updateTimerDisplay();

document.getElementById(
"timerStatus"
).textContent=
"🎉 انتهى وقت الدراسة!";

if(bellEnabled){

startAlarm();

}else{

alert(
"🎉 انتهى وقت الدراسة! أحسنت."
);

}

}

row.innerHTML+=`

<td>${item[0]}</td>
<td>${item[1]}</td>

`;

body.appendChild(row);

});

});

}


/* =========================
   نموذج التواصل
========================= */

const contactForm=
document.getElementById(
"contactForm"
);

const contactSubmit=
document.getElementById(
"contactSubmit"
);

const contactStatus=
document.getElementById(
"contactStatus"
);

if(contactForm){

contactForm.addEventListener(
"submit",
async event=>{

event.preventDefault();

const name=
document.getElementById(
"visitorName"
).value.trim();

const email=
document.getElementById(
"visitorEmail"
).value.trim();

const message=
document.getElementById(
"visitorQuestion"
).value.trim();

if(!name||!email||!message){

contactStatus.textContent=
"⚠️ اكتب اسمك وبريدك الإلكتروني وسؤالك أو اقتراحك أولاً.";

contactStatus.className=
"contact-error";

return;

}

const emailPattern=
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){

contactStatus.textContent=
"⚠️ أدخل بريدًا إلكترونيًا صحيحًا.";

contactStatus.className=
"contact-error";

return;

}

document.getElementById(
"replyTo"
).value=email;

contactSubmit.disabled=true;

contactSubmit.textContent=
"⏳ جارٍ إرسال السؤال...";

contactStatus.textContent="";

try{

const response=
await fetch(
contactForm.action,
{
method:"POST",
headers:{
"Accept":"application/json"
},
body:new FormData(contactForm)
}
);

const data=
await response.json()
.catch(()=>({}));

if(
!response.ok||
data.success===false
){

throw new Error(
"Send failed"
);

}

contactStatus.textContent=
"✅ تم إرسال سؤالك بنجاح! شكرًا لك.";

contactStatus.className=
"contact-success";

contactForm.reset();

}catch(error){

contactStatus.textContent=
"❌ لم يتم الإرسال. تأكد من تفعيل FormSubmit من الرسالة التي وصلت إلى Gmail.";

contactStatus.className=
"contact-error";

}

contactSubmit.disabled=false;

contactSubmit.textContent=
"📧 إرسال السؤال";

}
);

}
