<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learning is easy with us | برنامج الدراسة والمراجعة</title>

<meta name="keywords" content="Learning is easy with us, 1ع تك1, برنامج الدراسة, برنامج المراجعة, السنة الأولى ثانوي تقني">

<meta property="og:title" content="Learning is easy with us">

<meta property="og:description" content="برنامج الدراسة والمراجعة للسنة الأولى ثانوي تقني.">

<meta property="og:url" content="https://1-3in-tk1">

<style>

:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:rgba(15,31,51,.82);
    --card2:#102239;
    --text:#f8fbff;
    --muted:#9eb0c5;
    --blue:#19a9ff;
    --blue2:#006eff;
    --cyan:#35d6ff;
    --green:#20d69a;
    --red:#ff5268;
    --orange:#ffae35;
    --border:rgba(255,255,255,.09);
    --shadow:0 20px 55px rgba(0,0,0,.28);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,"Tahoma",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 10% 10%,rgba(0,168,255,.14),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(0,110,255,.12),transparent 25%),
        linear-gradient(135deg,var(--bg),var(--bg2));
    transition:.3s;
}

body.light{
    --bg:#eef6fc;
    --bg2:#dfeefa;
    --card:rgba(255,255,255,.9);
    --card2:#fff;
    --text:#14202d;
    --muted:#607080;
    --border:rgba(0,0,0,.08);
    --shadow:0 15px 40px rgba(25,80,120,.12);
}

body:before{
    content:"";
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(0,168,255,.07);
    filter:blur(80px);
    top:30%;
    right:-150px;
    pointer-events:none;
    z-index:-1;
}

nav{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    padding:14px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:rgba(6,17,30,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.light nav{
    background:rgba(255,255,255,.8);
}

.logo{
    font-size:21px;
    font-weight:900;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:9px;
}

.logo span{
    color:var(--blue);
}

.nav-links{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav-links a{
    text-decoration:none;
    color:var(--muted);
    font-weight:bold;
    padding:10px 15px;
    border-radius:10px;
    transition:.25s;
}

.nav-links a:hover,
.nav-links a.active{
    color:#fff;
    background:rgba(25,169,255,.13);
}

body.light .nav-links a:hover,
body.light .nav-links a.active{
    color:var(--blue2);
}

#theme-button{
    position:fixed;
    left:20px;
    bottom:20px;
    width:50px;
    height:50px;
    border:1px solid var(--border);
    border-radius:50%;
    background:var(--card);
    color:var(--text);
    box-shadow:var(--shadow);
    cursor:pointer;
    font-size:20px;
    z-index:1200;
    transition:.25s;
}

#theme-button:hover{
    transform:rotate(15deg) scale(1.06);
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

.hero{
    padding:65px 0 35px;
    text-align:center;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 15px;
    border:1px solid rgba(25,169,255,.2);
    border-radius:30px;
    background:rgba(25,169,255,.08);
    color:var(--cyan);
    font-weight:bold;
    font-size:14px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(34px,6vw,62px);
    line-height:1.15;
    margin-bottom:15px;
    font-weight:900;
}

.hero h1 span{
    background:linear-gradient(90deg,var(--cyan),var(--blue),#7b61ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    color:var(--muted);
    font-size:18px;
    line-height:1.8;
    max-width:700px;
    margin:auto;
}

.clock{
    margin:20px auto 0;
    display:inline-block;
    padding:10px 18px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--muted);
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(12px);
}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
}

.card-title .title-icon{
    width:43px;
    height:43px;
    display:grid;
    place-items:center;
    background:rgba(25,169,255,.1);
    border-radius:13px;
    font-size:21px;
}

.card h2{
    font-size:21px;
}

.card-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.current-card{
    overflow:hidden;
    position:relative;
}

.current-card:before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(25,169,255,.08);
    left:-70px;
    top:-80px;
}

.current-lesson{
    position:relative;
    text-align:center;
}

.lesson-status{
    display:inline-block;
    padding:7px 14px;
    border-radius:30px;
    background:rgba(32,214,154,.1);
    color:var(--green);
    font-weight:bold;
    font-size:14px;
}

.current-subject{
    font-size:clamp(28px,5vw,43px);
    font-weight:900;
    margin:17px 0 8px;
    color:var(--text);
}

.current-time{
    color:var(--muted);
    font-size:16px;
}

.school-timer{
    max-width:520px;
    margin:23px auto 0;
    padding:20px;
    border-radius:18px;
    background:linear-gradient(135deg,rgba(25,169,255,.12),rgba(0,110,255,.04));
    border:1px solid rgba(25,169,255,.14);
}

.school-timer-label{
    color:var(--muted);
    margin-bottom:8px;
}

.school-timer-display{
    direction:ltr;
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--cyan);
}

.bell-area{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.bell-button{
    border:0;
    padding:13px 22px;
    border-radius:13px;
    background:linear-gradient(135deg,var(--orange),#ff7b22);
    color:#fff;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(255,152,0,.2);
    transition:.25s;
}

.bell-button:hover{
    transform:translateY(-2px);
}

.bell-button.active{
    background:linear-gradient(135deg,var(--green),#0da978);
}

.bell-button.ringing{
    background:var(--red);
    animation:alarmPulse .8s infinite;
}

@keyframes alarmPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.stat{
    padding:22px 15px;
    text-align:center;
    border-radius:17px;
    background:rgba(25,169,255,.055);
    border:1px solid var(--border);
}

.stat-number{
    display:block;
    font-size:34px;
    font-weight:900;
    color:var(--blue);
    margin-bottom:7px;
}

.stat-label{
    color:var(--muted);
    font-size:14px;
}

.timer{
    text-align:center;
}

.timer select{
    appearance:none;
    padding:11px 18px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    font-size:15px;
    outline:none;
}

.timer-display{
    direction:ltr;
    font-size:72px;
    font-weight:900;
    letter-spacing:2px;
    margin:18px 0 5px;
    background:linear-gradient(90deg,var(--cyan),var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

#timerStatus{
    color:var(--muted);
}

.timer-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.timer-buttons button,
.main-button{
    border:0;
    padding:11px 18px;
    border-radius:11px;
    background:var(--blue);
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.timer-buttons button:hover,
.main-button:hover{
    transform:translateY(-2px);
    background:var(--blue2);
}

.achievements{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.achievement{
    text-align:center;
    padding:18px 10px;
    border-radius:16px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    opacity:.38;
    transition:.3s;
}

.achievement.unlocked{
    opacity:1;
    border-color:rgba(32,214,154,.5);
    background:rgba(32,214,154,.07);
    transform:translateY(-2px);
}

.achievement .icon{
    display:block;
    font-size:32px;
    margin-bottom:8px;
}

.schedule{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.day-card{
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
}

.day-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:var(--blue);
    font-size:20px;
    font-weight:900;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
    margin-bottom:12px;
}

.lesson{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(0,0,0,.13);
    border:1px solid transparent;
    transition:.2s;
}

.lesson:hover{
    border-color:rgba(25,169,255,.18);
}

.lesson-info{
    flex:1;
    min-width:0;
}

.lesson-time{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.lesson.completed{
    opacity:.45;
}

.lesson.completed .lesson-info{
    text-decoration:line-through;
}

.lesson button{
    border:0;
    min-width:34px;
    height:34px;
    border-radius:9px;
    background:var(--blue);
    color:#fff;
    cursor:pointer;
}

.lesson button.restore{
    background:#4d5965;
}

.reset-all{
    margin-top:18px;
    background:var(--red);
}

.reset-all:hover{
    background:#e63e55;
}

.school-schedule{
    overflow:hidden;
}

.table-wrap{
    overflow-x:auto;
    border-radius:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    padding:14px 12px;
    border:1px solid var(--border);
    text-align:center;
}

th{
    background:rgba(25,169,255,.08);
    color:var(--blue);
}

td{
    color:var(--muted);
}

.contact-card{
    text-align:center;
}

.contact-description{
    color:var(--muted);
    line-height:1.9;
    max-width:650px;
    margin:0 auto 25px;
}

.contact-form{
    width:min(650px,100%);
    margin:auto;
    text-align:right;
}

.contact-form label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    color:var(--text);
    font-family:Arial,sans-serif;
    font-size:15px;
    outline:none;
}

.contact-form input:focus,
.contact-form textarea:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(25,169,255,.1);
}

.contact-form textarea{
    min-height:140px;
    resize:vertical;
}

.contact-submit{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.contact-submit:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#contactStatus{
    margin-top:13px;
    line-height:1.7;
}

.contact-success{
    color:var(--green);
}

.contact-error{
    color:var(--red);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:3000;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
}

.modal-content{
    width:min(450px,100%);
    padding:25px;
    border-radius:22px;
    background:var(--card2);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

.modal-content h2{
    color:var(--blue);
    margin-bottom:20px;
}

.modal-content label{
    display:block;
    margin:12px 0 6px;
}

.modal-content input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--text);
    outline:none;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-buttons button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.save-button{
    background:var(--green);
    color:#fff;
}

.cancel-button{
    background:#555;
    color:#fff;
}

footer{
    text-align:center;
    color:var(--muted);
    padding:30px 10px 45px;
    font-size:14px;
}

footer strong{
    color:var(--blue);
}

@media(max-width:800px){

    nav{
        padding:12px 4%;
    }

    .logo{
        font-size:17px;
    }

    .nav-links a{
        padding:8px 9px;
        font-size:13px;
    }

    .hero{
        padding:45px 0 25px;
    }

    .hero p{
        font-size:16px;
    }

    .stats,
    .achievements,
    .schedule{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
        border-radius:19px;
    }

    .timer-display{
        font-size:55px;
    }

    .lesson{
        flex-wrap:wrap;
    }

    .school-timer-display{
        font-size:35px;
    }

    #theme-button{
        left:14px;
        bottom:14px;
    }
}

@media(max-width:480px){

    .nav-links{
        gap:2px;
    }

    .nav-links a{
        padding:7px;
        font-size:12px;
    }

    .hero h1{
        font-size:35px;
    }

    .current-subject{
        font-size:27px;
    }

    .lesson button{
        min-width:32px;
    }
}

</style>
