<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تواصل معي | برنامج دراستي</title>

    <style>

        :root {
            --bg: #101820;
            --nav: rgba(27, 38, 59, 0.95);
            --card: #182631;
            --text: #ffffff;
            --muted: #b8c7d1;
            --blue: #00a8ff;
            --green: #20c997;
            --red: #ff5c5c;
            --border: rgba(255,255,255,0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body.light {
            --bg: #f2f6f9;
            --nav: rgba(255,255,255,0.95);
            --card: #ffffff;
            --text: #17212b;
            --muted: #56616b;
            --border: rgba(0,0,0,0.08);
        }

        /* =========================
           القائمة
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--nav);
            backdrop-filter: blur(10px);

            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--blue);
        }

        .nav-links {
            display: flex;
            gap: 18px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: bold;
            padding: 5px;
            position: relative;
        }

        .nav-links a::after {
            content: "";

            position: absolute;

            bottom: -4px;
            right: 0;

            width: 0;
            height: 2px;

            background: var(--blue);

            transition: 0.3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* =========================
           زر الوضع الليلي
        ========================= */

        #theme-button {
            position: fixed;

            left: 15px;
            top: 75px;

            z-index: 1100;

            border: none;

            background: var(--blue);
            color: white;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 20px;
        }

        /* =========================
           المحتوى
        ========================= */

        .container {
            width: min(850px, 92%);
            margin: 60px auto;
        }

        .contact-card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        .contact-title {
            text-align: center;
            margin-bottom: 10px;
        }

        .contact-title h1 {
            color: var(--blue);
            font-size: 32px;
            margin-bottom: 10px;
        }

        .contact-title p {
            color: var(--muted);
            font-size: 17px;
        }

        /* =========================
           النموذج
        ========================= */

        .form-group {
            margin-top: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: rgba(255,255,255,0.05);

            color: var(--text);

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 3px rgba(0,168,255,0.12);
        }

        .form-group textarea {
            min-height: 180px;

            resize: vertical;

            font-family: Arial, sans-serif;
        }

        /* =========================
           زر الإرسال
        ========================= */

        .send-button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: var(--blue);

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .send-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0,168,255,0.25);
        }

        /* =========================
           رسالة النجاح
        ========================= */

        #successMessage {
            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: rgba(32,201,151,0.12);

            border: 1px solid var(--green);

            color: var(--green);

            text-align: center;

            font-weight: bold;
        }

        /* =========================
           العودة
        ========================= */

        .back-home {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: var(--muted);

            text-decoration: none;
        }

        .back-home:hover {
            color: var(--blue);
        }

        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 12px;
            }

            #theme-button {
                top: 120px;
            }

            .contact-card {
                padding: 22px;
            }

            .contact-title h1 {
                font-size: 27px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         القائمة
    ========================= -->

    <nav>

        <div class="logo">
            📚 برنامج دراستي
        </div>

        <div class="nav-links">

            <a href="index.html">
                الرئيسية
            </a>

            <a href="contact.html" class="active">
                تواصل معي
            </a>

        </div>

    </nav>


    <!-- زر الوضع الليلي -->

    <button
        id="theme-button"
        onclick="toggleTheme()">

        🌙

    </button>


    <!-- =========================
         صفحة التواصل
    ========================= -->

    <main class="container">

        <div class="contact-card">

            <div class="contact-title">

                <h1>
                    📩 تواصل معي
                </h1>

                <p>
                    لديك سؤال أو اقتراح؟
                    اكتب اسمك ورسالتك وسأتمكن من قراءتها.
                </p>

            </div>


            <form id="contactForm">


                <!-- الاسم -->

                <div class="form-group">

                    <label for="name">
                        👤 اسمك
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="اكتب اسمك هنا"
                        required>

                </div>


                <!-- السؤال -->

                <div class="form-group">

                    <label for="message">
                        ❓ سؤالك أو رسالتك
                    </label>

                    <textarea
                        id="message"
                        placeholder="اكتب سؤالك أو اقتراحك هنا..."
                        required></textarea>

                </div>


                <!-- زر الإرسال -->

                <button
                    type="submit"
                    class="send-button">

                    📧 إرسال الرسالة

                </button>


                <div id="successMessage">

                    ✅ تم تجهيز رسالتك.
                    سيتم فتح برنامج البريد لإرسالها.

                </div>


            </form>


            <a
                href="index.html"
                class="back-home">

                ← العودة إلى برنامج دراستي

            </a>

        </div>

    </main>


    <script>

        /* =========================
           البريد الذي ستصل إليه الرسائل
        ========================= */

        const email =
            "djawjadsabdallah2@gmail.com";


        /* =========================
           إرسال الرسالة
        ========================= */

        document
            .getElementById("contactForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const name =
                    document
                    .getElementById("name")
                    .value
                    .trim();


                const message =
                    document
                    .getElementById("message")
                    .value
                    .trim();


                if (!name || !message) {

                    alert(
                        "يرجى كتابة اسمك ورسالتك."
                    );

                    return;
                }


                const subject =
                    encodeURIComponent(
                        "رسالة من موقع برنامج دراستي - " + name
                    );


                const body =
                    encodeURIComponent(
                        "اسم السائل: " +
                        name +
                        "\n\n" +
                        "السؤال / الرسالة:\n" +
                        message
                    );


                document
                    .getElementById("successMessage")
                    .style.display = "block";


                window.location.href =
                    "mailto:" +
                    email +
                    "?subject=" +
                    subject +
                    "&body=" +
                    body;

            });


        /* =========================
           الوضع الليلي
        ========================= */

        function toggleTheme() {

            document.body.classList.toggle("light");


            const isLight =
                document.body.classList.contains("light");


            localStorage.setItem(
                "studyTheme",
                isLight
                    ? "light"
                    : "dark"
            );


            document
                .getElementById("theme-button")
                .textContent =
                isLight
                    ? "☀️"
                    : "🌙";
        }


        /* =========================
           تحميل الوضع المحفوظ
        ========================= */

        function loadTheme() {

            const theme =
                localStorage.getItem(
                    "studyTheme"
                );


            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );


                document
                    .getElementById("theme-button")
                    .textContent = "☀️";

            } else {

                document
                    .getElementById("theme-button")
                    .textContent = "🌙";
            }
        }


        loadTheme();

    </script>

</body>

</html>
